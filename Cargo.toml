[package]
name = "agygram"
version = "1.5.13"
edition = "2024"
rust-version = "1.88"

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "signal", "net"] }
tokio-util = { version = "0.7", default-features = false }
teloxide = { version = "0.13", default-features = false, features = ["macros", "webhooks-axum", "ctrlc_handler", "rustls-native-roots"] }
url = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
bytes = "1.0"
dirs = "5.0"
which = "6.0"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls-native-roots", "socks", "json"] }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
rustc-hash = "1.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 3

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
large_futures = "warn"
