# agygram 配置文件模版 (config.example.toml)
# 使用方法: cp config.example.toml ~/.config/agygram/config.toml

# Telegram Bot Token (必填，从 @BotFather 获取)
bot_token = "YOUR_TELEGRAM_BOT_TOKEN"

# 授权操作的 Telegram User ID 列表 (白名单)
# 获取自身 User ID 可在 Telegram 咨询 @userinfobot
# 留空 = 拒绝所有请求（本守护进程以 --dangerously-skip-permissions 执行 agy，
# 因此对外开放必须显式打开下面的 allow_all_users，而不是靠留空）
allowed_user_ids = [123456789]

# 显式允许任意 Telegram 用户驱动本机器（默认关闭，谨慎开启）
allow_all_users = false

# 默认主工作目录 (支持绝对路径或 ~ 展开)
default_workspace = "~"

# 默认 AI 模型 (留空使用系统默认，例如: "gemini-3.8-flash-high", "claude-sonnet-4-6")
default_model = ""

# 默认思考力度: low | medium | high
default_effort = "high"

# 默认执行模式: accept-edits (自动编辑) | plan (规划模式)
default_mode = "accept-edits"

# 代理设置 (可选，支持 HTTP / SOCKS5，例如: "socks5://127.0.0.1:1080")
# proxy_url = "socks5://127.0.0.1:1080"

# 打字机流式更新最小间隔 (毫秒，建议 1000ms 防抖避免 Telegram 429 限频)
draft_update_interval_ms = 1000

# 收到新消息时是否打断上一任务 (实时交互模式)
interrupt_on_new_message = true

# agy CLI 智能看门狗超时配置 (秒)
# idle_timeout_secs: 静默空闲超时（当连续无输出且子进程树无 CPU/IO 活跃时，判定为真卡死并终止）
idle_timeout_secs = 180
# max_execution_secs: 单次任务全局安全上限（防止死循环，支持长编译/深度长任务）
max_execution_secs = 3600
# 兼容旧版配置
executor_timeout_secs = 300

# Telegram MTProto User API 配置 (可选，用于用户客户端登录与自动化测试)
# 申请地址: https://my.telegram.org/apps
# api_id = 12345678
# api_hash = "your_api_hash_here"

# Fish Audio TTS 语音合成密钥与音色参考 ID (可选，用于申鹤语音回复模式)
# 官网: https://fish.audio
# fish_api_key = "your_fish_audio_api_key"
# fish_reference_id = "your_voice_reference_id"
