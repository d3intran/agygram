name: 🐛 Bug Report
description: Report a crash, rendering issue, protocol bug, or unexpected behavior in agygram
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue!
        ⚠️ **Security Reminder**: Never paste `bot_token`, `qq_app_secret`, `fish_api_key`, OAuth tokens, `.session` files, or private server IPs.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-flight Checks
      options:
        - label: I have checked the README / FAQ and existing issues.
          required: true
        - label: I have removed all secrets, tokens, and public IPs from logs and config snippets.
          required: true

  - type: dropdown
    id: platform
    attributes:
      label: Affected Surface / Subsystem
      options:
        - Telegram Bot
        - QQ Bot (Open Platform)
        - Dual-Stack (Telegram + QQ)
        - Markdown / Table Rendering
        - Executor / Stream-JSON / Watchdog
        - Quota / Model Control Panel
        - TTS / Media / Artifact Delivery
        - CLI / Config / Systemd / CI
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Environment & Versions
      description: Output of `agygram --version`, `agy --version`, and your OS / RAM specs.
      placeholder: |
        - agygram version: v1.6.0
        - agy version: 1.5.x
        - OS & Arch: Ubuntu 24.04 x86_64 (1 GB RAM VPS)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug & Steps to Reproduce
      description: Clear explanation of what happened vs what you expected.
      placeholder: |
        1. Configure ...
        2. Send `/status` or a table prompt ...
        3. Observed ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs (Sanitized)
      description: Output from `journalctl -u agygram -n 80 --no-pager` (redact all tokens/IDs if private).
      render: shell
